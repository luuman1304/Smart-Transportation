[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lastmile-route-study"
version = "0.1.0"
description = "Station cold-start evaluation for last-mile route sequencing."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
research = [
  "joblib>=1.3",
  "natsort>=8.4",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "scikit-learn>=1.3",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
